name: Publish

on:
  workflow_dispatch:
  release:
    types: [released, prereleased]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish all supported platforms
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Restore Gradle properties and signing key
        shell: bash
        env:
          GRADLE_PROPERTIES_CONTENT: ${{ secrets.GRADLE_PROPERTIES }}
          GPG_SECRET_KEY_RING_BASE64: ${{ secrets.GPG_SECRET_KEY_RING_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PROPERTIES_CONTENT"
          test -n "$GPG_SECRET_KEY_RING_BASE64"
          gradle_dir="$HOME/.gradle"
          properties_file="$gradle_dir/gradle.properties"
          keyring="$gradle_dir/hypnotic-canvas-secret-key.gpg"
          mkdir -p "$gradle_dir"
          printf '%s' "$GRADLE_PROPERTIES_CONTENT" > "$properties_file"
          printf '%s' "$GPG_SECRET_KEY_RING_BASE64" | tr -d '\r\n ' | openssl base64 -d -A > "$keyring"
          test -s "$keyring"
          awk '!/^signing.secretKeyRingFile=/' "$properties_file" > "$properties_file.tmp"
          mv "$properties_file.tmp" "$properties_file"
          printf '\nsigning.secretKeyRingFile=%s\n' "$keyring" >> "$properties_file"
          chmod 600 "$properties_file" "$keyring"

      - name: Publish Android, JVM, JS, Wasm, iOS, Linux, and Windows
        run: |
          ./gradlew \
            :lib:publishToMavenCentral \
            --no-daemon \
            --stacktrace \
            --no-configuration-cache
